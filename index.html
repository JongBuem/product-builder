<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>로또 번호 추천</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f5f7fa;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
      }

      .container {
        background: #ffffff;
        padding: 32px 40px;
        border-radius: 12px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        text-align: center;
        width: 360px;
      }

      h1 {
        margin-bottom: 24px;
        font-size: 22px;
      }

      .set {
        display: flex;
        justify-content: center;
        gap: 10px;
        margin-bottom: 12px;
      }

      .ball {
        width: 38px;
        height: 38px;
        border-radius: 50%;
        background: #4f46e5;
        color: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: bold;
        font-size: 15px;
      }

      button {
        margin-top: 20px;
        padding: 12px 20px;
        font-size: 15px;
        font-weight: bold;
        border: none;
        border-radius: 8px;
        background: #111827;
        color: #fff;
        cursor: pointer;
        transition: background 0.2s ease;
      }

      button:hover {
        background: #374151;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>🎰 로또 번호 추천 (5세트)</h1>
      <div id="lottoContainer"></div>
      <button onclick="generateLottoSets()">번호 추천받기</button>
    </div>

    <script>
      function generateLottoNumbers() {
        const numbers = [];

        while (numbers.length < 6) {
          const num = Math.floor(Math.random() * 45) + 1;
          if (!numbers.includes(num)) {
            numbers.push(num);
          }
        }

        return numbers.sort((a, b) => a - b);
      }

      function generateLottoSets() {
        const container = document.getElementById("lottoContainer");
        container.innerHTML = "";

        for (let i = 0; i < 5; i++) {
          const numbers = generateLottoNumbers();
          const setDiv = document.createElement("div");
          setDiv.className = "set";

          numbers.forEach((num) => {
            const ball = document.createElement("div");
            ball.className = "ball";
            ball.textContent = num;
            setDiv.appendChild(ball);
          });

          container.appendChild(setDiv);
        }
      }
    </script>
  </body>
</html>
