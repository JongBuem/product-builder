<!doctype html>
<html lang="ko">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lotto Pro - 로또 번호 생성기</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body class="bg-dark text-white">

  <nav class="navbar navbar-expand-lg navbar-dark bg-dark border-bottom border-secondary">
    <div class="container-fluid">
      <a class="navbar-brand fw-bold" href="#">Lotto Pro 🎰</a>
    </div>
  </nav>

  <main class="container my-5">
    <div class="text-center mb-5">
      <h1 class="display-4 fw-bold">차세대 로또 번호 생성기</h1>
      <p class="lead text-white-50">단순한 무작위 추천을 넘어, 통계적 분석으로 확률을 높여보세요.</p>
    </div>

    <div class="row g-5">
      <!-- 단순 랜덤 생성 -->
      <div class="col-md-6">
        <div class="card bg-secondary text-white h-100">
          <div class="card-body text-center">
            <h2 class="card-title h3">단순 랜덤 생성</h2>
            <p class="card-text text-white-50">가장 순수한 무작위 번호 5세트를 추천받으세요.</p>
            <button class="btn btn-primary fw-bold" onclick="generateSimpleSets()">랜덤 번호 받기</button>
            <div id="simpleLottoContainer" class="mt-4"></div>
          </div>
        </div>
      </div>

      <!-- 통계 데이터 기반 생성 -->
      <div class="col-md-6">
        <div class="card bg-secondary text-white h-100">
          <div class="card-body text-center">
            <h2 class="card-title h3">과거 데이터 기반 생성</h2>
            <p class="card-text text-white-50">역대 당첨 번호 데이터를 분석하여, 가장 확률 높은 번호 5세트를 추천합니다.</p>
            <button class="btn btn-success fw-bold" onclick="generateStatisticalSets()">통계 번호 받기</button>
            <div id="statisticalLottoContainer" class="mt-4"></div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <footer class="text-center text-white-50 py-4 mt-5 border-top border-secondary">
    <p>&copy; 2024 Lotto Pro. All Rights Reserved.</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="main.js"></script>
</body>

</html>
